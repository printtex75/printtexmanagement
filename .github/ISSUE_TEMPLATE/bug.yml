name: 🐛 Bug
description: Quelque chose ne marche pas comme prévu
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: quoi
    attributes:
      label: Ce qui se passe
      description: Décris le problème et, si possible, comment le reproduire.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: input
    id: appareil
    attributes:
      label: Appareil / navigateur
      placeholder: "Ex : iPhone Safari, PC Chrome"
