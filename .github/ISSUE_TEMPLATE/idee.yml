name: 💡 Idée
description: Proposer une idée pour l'outil Printtex. Claude l'analyse tout seul et le chef décide.
title: "[Idée] "
labels: ["idée", "à discuter"]
body:
  - type: markdown
    attributes:
      value: |
        Décris l'idée en trois questions. Claude passe toutes les deux heures : il poste son analyse en commentaire (pour, contre, répercussions, ce qu'il faudrait pour que ça marche, avis) et prévient le chef, qui décide de lancer ou non. Avant de continuer, jette un œil aux **issues ouvertes** : si une idée proche existe, commente-la plutôt.
  - type: textarea
    id: change
    attributes:
      label: Qu'est-ce que ça change concrètement ?
      description: Ce que l'outil ferait de nouveau ou autrement.
      placeholder: "Ex : une liste « à relancer » en haut des commandes, avec les commandes prêtes depuis plus de 5 jours et le téléphone du client."
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Qu'est-ce que ça arrange ?
      description: Le problème d'aujourd'hui, dans quelle situation.
      placeholder: "Ex : on oublie de relancer, les commandes restent des semaines sur l'étagère."
    validations:
      required: true
  - type: textarea
    id: but
    attributes:
      label: Dans quel but ?
      description: Le résultat attendu.
      placeholder: "Ex : encaisser plus vite et libérer la place dans l'atelier."
    validations:
      required: true
  - type: dropdown
    id: zone
    attributes:
      label: Partie de l'application concernée
      options:
        - Commandes
        - Marques / portail marque
        - Vectorizer
        - Cockpit
        - Connexion / comptes
        - Autre / je ne sais pas
    validations:
      required: true
  - type: dropdown
    id: priorite
    attributes:
      label: Priorité selon toi
      options:
        - Ça bloque / urgent
        - Ce serait bien vite
        - Un jour, si on a le temps
    validations:
      required: true
