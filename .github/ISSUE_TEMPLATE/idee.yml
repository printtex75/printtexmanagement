name: 💡 Idée
description: Proposer une nouvelle idée ou amélioration pour Printtex
title: "[Idée] "
labels: ["idée", "à discuter"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Avant de continuer, jette un œil à la **liste des issues ouvertes** : si une idée proche existe déjà, commente-la plutôt que d'en ouvrir une nouvelle.
  - type: checkboxes
    id: doublon
    attributes:
      label: Vérification
      options:
        - label: J'ai cherché dans les issues existantes et je n'ai rien trouvé de similaire
          required: true
  - type: textarea
    id: probleme
    attributes:
      label: Le problème ou le besoin
      description: Qu'est-ce qui manque ou qui gêne aujourd'hui ? Dans quelle situation ?
      placeholder: "Ex : quand une commande est prête depuis plus de 5 jours, on oublie de relancer le client."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: La solution envisagée
      description: Comment tu imagines la chose. Pas besoin d'être précis, c'est le point de départ de la discussion.
      placeholder: "Ex : une pastille rouge sur la carte de commande et une liste « à relancer » en haut de l'onglet."
    validations:
      required: true
  - type: dropdown
    id: zone
    attributes:
      label: Partie de l'application concernée
      options:
        - Commandes
        - Marques / portail marque
        - Vectorizer
        - Cockpit
        - Connexion / comptes
        - Autre / je ne sais pas
    validations:
      required: true
  - type: dropdown
    id: priorite
    attributes:
      label: Priorité selon toi
      options:
        - Ça bloque / urgent
        - Ce serait bien vite
        - Un jour, si on a le temps
    validations:
      required: true
